name: Kittycorn router checks
on:
  pull_request:
  push:
    branches: [main, feat/kittycorn]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          path: smart-order-router
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: smart-order-router
      - run: npm run check:abis && npm audit --audit-level=moderate
        working-directory: smart-order-router
      - run: npm run build && npm run typecheck:cli
        working-directory: smart-order-router
      - run: npm test -- --maxWorkers=2
        working-directory: smart-order-router
      - run: npm run pack:release
        working-directory: smart-order-router
